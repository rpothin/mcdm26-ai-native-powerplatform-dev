# deploy-solution.yml
#
# PURPOSE
# -------
# Deploys updated Power Platform solutions to the production environment
# whenever changes to `solutions/**` are pushed to the `main` branch.
# Each changed solution is packed from its unpacked folder and imported
# via the PAC CLI using an OIDC-based auth flow (no long-lived secrets).
#
# AZURE AD SETUP REQUIRED
# -----------------------
# 1. Create an App Registration in Azure AD (Entra ID).
# 2. Under "Certificates & secrets → Federated credentials", add a credential:
#      - Scenario : GitHub Actions deploying Azure resources
#      - Organization: rpothin
#      - Repository : mcdm26-ai-native-powerplatform-dev
#      - Entity     : Branch
#      - Branch name: main
#    This allows the workflow to exchange the GitHub OIDC token for an Azure
#    access token without storing a client secret anywhere.
# 3. Grant the App Registration access to the target Power Platform environment
#    (System Administrator or equivalent security role).
#
# REPOSITORY SECRETS (Settings → Secrets → Actions)
# ---------------------------------------------------
#   AZURE_CLIENT_ID       – Application (client) ID of the App Registration
#   AZURE_TENANT_ID       – Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID – Azure subscription ID
#
# REPOSITORY VARIABLES (Settings → Variables → Actions)
# ------------------------------------------------------
#   PROD_ENVIRONMENT_URL  – Production Power Platform environment URL
#                           e.g. https://org1234abcd.crm.dynamics.com
#
# DEPLOYMENT SETTINGS PER SOLUTION
# ---------------------------------
# Each solution folder must contain a `deployment-settings.json` file that
# maps environment-specific connection references and environment variables.
# Generate a template from an existing packed zip:
#   pac solution create-settings --solution-zip <file>.zip --settings-file deployment-settings.json

on:
  push:
    branches: [main]
    paths: ['solutions/**']

permissions:
  id-token: write  # Required for OIDC token exchange with Azure AD
  contents: write  # Required for gh release create/edit/delete

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: detect — find which solution folders changed in this push
  # ---------------------------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    outputs:
      solutions: ${{ steps.changed.outputs.solutions }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need HEAD and HEAD~1 to compute the diff

      - name: Detect changed solutions
        id: changed
        run: |
          # List files that changed between the previous commit and this one,
          # filter to paths inside solutions/, extract the solution name (second
          # path segment), deduplicate, then encode as a JSON array.
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'solutions/' \
            | sed 's|solutions/\([^/]*\)/.*|\1|' \
            | sort -u)

          if [ -z "$CHANGED" ]; then
            echo "solutions=[]" >> "$GITHUB_OUTPUT"
          else
            # Build a JSON array from the newline-delimited list.
            JSON=$(echo "$CHANGED" | jq -R . | jq -sc .)
            echo "solutions=$JSON" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Job 2: deploy — pack and import each changed solution
  # ---------------------------------------------------------------------------
  deploy:
    needs: detect
    if: ${{ needs.detect.outputs.solutions != '[]' && needs.detect.outputs.solutions != '' }}
    # Queue imports for this workflow/environment to avoid concurrent solution
    # deployments, which can fail due to Power Platform import-side locking.
    concurrency:
      group: powerplatform-prod-solution-deploy
      cancel-in-progress: false

    strategy:
      matrix:
        solution: ${{ fromJson(needs.detect.outputs.solutions) }}
      fail-fast: false  # Let independent solutions proceed even if one fails

    environment: production  # Enables GitHub environment protection rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PAC CLI
        uses: microsoft/powerplatform-actions/install-pac-cli@v1

      - name: Create release candidate
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="${{ matrix.solution }}-v${SHORT_SHA}-rc"
          gh release create "$TAG" \
            --prerelease \
            --title "${{ matrix.solution }} RC-${SHORT_SHA}" \
            --notes "Automated release candidate for ${{ matrix.solution }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Pack solution
        run: |
          mkdir -p dist
          pac solution pack \
            --folder "solutions/${{ matrix.solution }}" \
            --zipfile "dist/${{ matrix.solution }}.zip" \
            --processCanvasApps

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate PAC CLI
        run: |
          # Exchange the Azure session token for a Power Platform-scoped token,
          # then register the auth context so subsequent pac commands target the
          # correct environment without storing credentials in the workflow.
          TOKEN=$(az account get-access-token \
            --resource "https://service.powerapps.com/" \
            --query accessToken -o tsv)
          pac auth create \
            --environment "${{ vars.PROD_ENVIRONMENT_URL }}" \
            --token "$TOKEN"

      - name: Import solution
        id: import
        continue-on-error: false
        run: |
          pac solution import \
            --path "dist/${{ matrix.solution }}.zip" \
            --deploymentSettingsFile "solutions/${{ matrix.solution }}/deployment-settings.json" \
            --activate-plugins \
            --force-overwrite \
            --publish-changes

      - name: Promote release on success
        if: steps.import.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.create_release.outputs.tag }}"
          gh release edit "$TAG" --prerelease=false --latest

      - name: Rollback release on failure
        if: failure() && steps.create_release.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.create_release.outputs.tag }}"
          gh release delete "$TAG" --yes
          # Remove the tag from the remote; ignore errors if it was never pushed.
          git push origin --delete "$TAG" || true
